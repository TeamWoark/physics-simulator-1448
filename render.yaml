# ============================================================
#  محاكي فيزياء الرخصة المهنية — منصة تفرّد
#  إعداد الأسئلة: أ. ماهر علي | البرمجة: أ. سالم شطا
#  ملف إعدادات النشر التلقائي على Render (Blueprint)
#  الموقع ثابت (Static) بملف واحد index.html — لا يحتاج بناءً ولا خادمًا
#  لتغيير اسم الرابط: عدّل قيمة name بالأسفل قبل إنشاء الخدمة
#  الرابط بعد النشر سيكون: https://physics-simulator-1448.onrender.com
# ============================================================
services:
  - type: web
    name: physics-simulator-1448
    runtime: static
    branch: main
    buildCommand: echo "Static site - no build step required"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
